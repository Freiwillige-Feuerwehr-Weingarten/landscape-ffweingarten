[defaults]
# inventory = hosts
vault_password_file = .vault_password
forks = 30
# Tolerate truthy-string `when:` conditionals from older galaxy roles
# (systemli.apt_repositories pulled in by systemli.jitsi_meet uses
# `when: _config.name is defined and _config.name`, which Ansible 2.20+
# rejects as not strictly boolean). Remove this once upstream catches up.
allow_broken_conditionals = True