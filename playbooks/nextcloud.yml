---
# Run the Nextcloud stack alone, scoped to whichever `docker` host the
# selected inventory points at (test.yml -> docker.test.ff-weingarten.de,
# prod.yml -> docker.prod.ff-weingarten.de). The same role is also pulled in
# by playbooks/docker.yml as part of the full docker-host run.
- name: Deploy Nextcloud
  hosts: docker
  remote_user: ffweingarten
  become: true
  gather_facts: true
  roles:
    - { role: nextcloud, tags: [nextcloud] }
