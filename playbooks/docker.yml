---
# Role to install docker
- name: Install docker
  become: true
  hosts: docker
  remote_user: ffweingarten
  gather_facts: true
  roles:
    - common
    - nfs
    - docker
    - portainer
    - authentik
    - netboot
    - heimdall
    - rustdesk
    - traccar
    - bookstack
    - nextcloud
    - adminer
    - taiga
