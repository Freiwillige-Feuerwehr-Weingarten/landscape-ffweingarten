---
- name: Update Portainer Container
  community.docker.docker_container:
    name: portainer
    image: portainer/portainer-ce:latest
    restart_policy: "always"
    published_ports:
      - 8000:8000
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    pull: always
    state: started
    restart: true
    recreate: true

- name: Remove password file
  ansible.builtin.file:
    path: /tmp/portainer_password.pwd
    state: absent
