---
- name: Assert role maturity permits this environment
  ansible.builtin.assert:
    that:
      - nfs_status in ['stable', 'testing', 'unstable']
      - >-
        nfs_status == 'stable'
        or (nfs_status == 'testing' and env | default('') == 'test')
    fail_msg: >-
      Role 'nfs' is marked status={{ nfs_status }} and cannot run
      against env={{ env | default('unset') }}. Promote the role in
      defaults/main.yml, or override nfs_status per host.
  tags: always

- name: Install nfs-common
  ansible.builtin.apt:
    pkg: nfs-common
    state: present
  when: ansible_os_family == 'Debian'
  tags: [setup]

- name: Create NFS mountpoint
  ansible.builtin.file:
    path: "{{ nfs_mountpoint }}"
    state: directory
    mode: "{{ nfs_permissions }}"
    owner: root
    group: root
  tags: [setup]

- name: Mount nfs share
  ansible.posix.mount:
    src: "{{ nfs_src }}"
    path: "{{ nfs_mountpoint }}"
    fstype: nfs
    opts: "{{ nfs_options }}"
    state: mounted
  notify: Remount nfs share
  tags: [service]
