---
- name: Assert role maturity permits this environment
  ansible.builtin.assert:
    that:
      - adminer_status in ['stable', 'testing', 'unstable']
      - >-
        adminer_status == 'stable'
        or (adminer_status == 'testing' and env | default('') == 'test')
    fail_msg: >-
      Role 'adminer' is marked status={{ adminer_status }} and cannot run
      against env={{ env | default('unset') }}. Promote the role in
      defaults/main.yml, or override adminer_status per host.
  tags: always

- name: Create a adminer directory if it does not exist
  ansible.builtin.file:
    path: "{{ adminer_dir }}"
    state: directory
    mode: '0755'
  tags: [setup]

- name: Copy docker compose
  ansible.builtin.template:
    src: templates/adminer.j2
    dest: "{{ adminer_dir }}/docker-compose.yml"
    mode: "{{ adminer_compose_mode }}"
  notify: Restart Adminer
  tags: [config]

- name: Create and start services
  community.docker.docker_compose_v2:
    project_src: "{{ adminer_dir }}"
    build: policy
    pull: policy
    recreate: auto
  register: admineroutput
  tags: [service]

- name: Show results
  ansible.builtin.debug:
    var: admineroutput
  when: docker_debug
  tags: [debug]
