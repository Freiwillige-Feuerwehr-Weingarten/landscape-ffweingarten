---
- name: Assert role maturity permits this environment
  ansible.builtin.assert:
    that:
      - rustdesk_status in ['stable', 'testing', 'unstable']
      - >-
        rustdesk_status == 'stable'
        or (rustdesk_status == 'testing' and env | default('') == 'test')
    fail_msg: >-
      Role 'rustdesk' is marked status={{ rustdesk_status }} and cannot run
      against env={{ env | default('unset') }}. Promote the role in
      defaults/main.yml, or override rustdesk_status per host.
  tags: always

- name: Create a rustdesk directory if it does not exist
  ansible.builtin.file:
    path: "{{ rustdesk_dir }}"
    state: directory
    mode: '0755'
  tags: [setup]

- name: Copy docker compose
  ansible.builtin.template:
    src: templates/rustdesk.docker-compose.j2
    dest: "{{ rustdesk_dir }}/docker-compose.yml"
    mode: "{{ rustdesk_compose_mode }}"
  tags: [config]

- name: Create and start services
  community.docker.docker_compose_v2:
    project_src: "{{ rustdesk_dir }}"
    build: policy
    pull: policy
    recreate: auto
  register: rustdeskoutput
  tags: [service]

- name: Show results
  ansible.builtin.debug:
    var: rustdeskoutput
  when: docker_debug
  tags: [debug]
