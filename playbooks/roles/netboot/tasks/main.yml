---
- name: Assert role maturity permits this environment
  ansible.builtin.assert:
    that:
      - netboot_status in ['stable', 'testing', 'unstable']
      - >-
        netboot_status == 'stable'
        or (netboot_status == 'testing' and env | default('') == 'test')
    fail_msg: >-
      Role 'netboot' is marked status={{ netboot_status }} and cannot run
      against env={{ env | default('unset') }}. Promote the role in
      defaults/main.yml, or override netboot_status per host.
  tags: always

- name: Create a netboot directory if it does not exist
  ansible.builtin.file:
    path: "{{ netboot_dir }}"
    state: directory
    mode: '0755'
  tags: [setup]

- name: Copy docker compose
  ansible.builtin.template:
    src: templates/netboot.xyz.j2
    dest: "{{ netboot_dir }}/docker-compose.yml"
    mode: "{{ netboot_compose_mode }}"
  notify: Restart Netboot
  tags: [config]

- name: Create and start services
  community.docker.docker_compose_v2:
    project_src: "{{ netboot_dir }}"
    build: policy
    pull: policy
    recreate: auto
  register: netbootoutput
  tags: [service]

- name: Show results
  ansible.builtin.debug:
    var: netbootoutput
  when: docker_debug
  tags: [debug]
