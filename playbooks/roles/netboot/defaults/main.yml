---
# Production-readiness gate. Allowed values: stable | testing | unstable.
# The role's first task asserts this matches the target inventory's env:
# stable runs anywhere; testing only on env=test; unstable on neither.
netboot_status: stable

# Filesystem layout
netboot_dir: /srv/netboot
netboot_compose_mode: '0644'

# Image / version
netboot_image: lscr.io/linuxserver/netbootxyz
netboot_version: 0.7.6-ls222

# linuxserver.io PUID/PGID — match these to the host user that should own /config + /assets.
netboot_puid: 1000
netboot_pgid: 1000
netboot_tz: Europe/Berlin

# netbootxyz tunables (see linuxserver/netbootxyz docs).
# Leave netboot_menu_version empty to use the image-bundled menu.
netboot_menu_version: ""
netboot_port_range: "30000:30010"
netboot_subfolder: "/"
netboot_nginx_port: 80
netboot_web_app_port: 3000

# Host-side ports
netboot_web_port: 3000          # web admin UI
netboot_tftp_port: 69           # TFTP (UDP)
netboot_http_port: 8081         # HTTP boot menu (maps to container nginx_port)

# Volumes — named volumes by default; override to bind-mount host paths if you
# want the menu/assets to survive `docker compose down -v`.
netboot_config_volume: config
netboot_assets_volume: assets

# Container runtime
netboot_restart_policy: unless-stopped

# Resource limits (leave empty to disable)
netboot_mem_limit: "512m"
netboot_cpus: "1.0"

# Security hardening — defaults are conservative for netbootxyz:
#   - cap_drop: ALL breaks TFTP (needs CAP_NET_BIND_SERVICE for :69 inside the container).
#   - read_only breaks s6-overlay / nginx tmp paths that live outside the volumes.
# Flip on per host only after verifying the boot flow still works.
netboot_no_new_privileges: true
netboot_drop_all_caps: false
netboot_read_only: false
