- name: Install Docker and related packages
  ansible.builtin.apt:
    state: present
    update_cache: true
    pkg:
      - docker-ce
      - docker-ce-cli
      # - docker-compose
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker

- name: Add Docker group
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Enable and start Docker services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - docker.service
    - containerd.service
