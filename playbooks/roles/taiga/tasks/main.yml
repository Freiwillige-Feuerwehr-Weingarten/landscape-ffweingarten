---
- name: Assert role maturity permits this environment
  ansible.builtin.assert:
    that:
      - taiga_status in ['stable', 'testing', 'unstable']
      - >-
        taiga_status == 'stable'
        or (taiga_status == 'testing' and env | default('') == 'test')
    fail_msg: >-
      Role 'taiga' is marked status={{ taiga_status }} and cannot run
      against env={{ env | default('unset') }}. Promote the role in
      defaults/main.yml, or override taiga_status per host.
  tags: always

- name: Assert required secrets are defined
  ansible.builtin.assert:
    that:
      - taiga_secret_key is defined and taiga_secret_key | length > 0
      - taiga_postgres_password is defined and taiga_postgres_password | length > 0
      - taiga_rabbitmq_password is defined and taiga_rabbitmq_password | length > 0
      - taiga_rlang_cookie is defined and taiga_rlang_cookie | length > 0
    fail_msg: >-
      taiga_secret_key, taiga_postgres_password, taiga_rabbitmq_password
      and taiga_rlang_cookie must be defined in host_vars (as !vault blocks)
      before running this role. Changing taiga_secret_key against an
      existing DB will make encrypted columns unreadable.
  tags: [setup]

- name: Create taiga base directory
  ansible.builtin.file:
    path: "{{ taiga_dir }}"
    state: directory
    mode: '0755'
  tags: [setup]

- name: Clone upstream taiga-docker (pinned) for the gateway nginx config
  ansible.builtin.git:
    repo: "{{ taiga_docker_repo }}"
    dest: "{{ taiga_dir }}"
    depth: 1
    force: true
    version: "{{ taiga_docker_version }}"
  tags: [setup]

- name: Create custom-back and custom-front directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ taiga_dir }}/custom-back"
    - "{{ taiga_dir }}/custom-front"
  tags: [setup]

- name: Render docker-compose.yml (overrides upstream clone)
  ansible.builtin.template:
    src: templates/taiga.docker-compose.j2
    dest: "{{ taiga_dir }}/docker-compose.yml"
    mode: "{{ taiga_compose_mode }}"
  notify: Restart Taiga
  tags: [config]

- name: Render .env
  ansible.builtin.template:
    src: templates/taiga.env.j2
    dest: "{{ taiga_dir }}/.env"
    mode: "{{ taiga_env_mode }}"
  notify: Restart Taiga
  tags: [config]

- name: Render custom-back Dockerfile
  ansible.builtin.template:
    src: templates/taiga.dockerfile.j2
    dest: "{{ taiga_dir }}/custom-back/Dockerfile"
    mode: '0644'
  notify: Restart Taiga
  tags: [config]

- name: Render custom-back config.append.py
  ansible.builtin.template:
    src: templates/taiga.config.append.j2
    dest: "{{ taiga_dir }}/custom-back/config.append.py"
    mode: '0644'
  notify: Restart Taiga
  tags: [config]

- name: Render custom-front conf.override.json
  ansible.builtin.template:
    src: templates/taiga.config.json.j2
    dest: "{{ taiga_dir }}/custom-front/conf.override.json"
    mode: '0644'
  notify: Restart Taiga
  tags: [config]

- name: Create and start Taiga services
  community.docker.docker_compose_v2:
    project_src: "{{ taiga_dir }}"
    build: policy
    pull: policy
    recreate: auto
    remove_orphans: true
  register: taiga_output
  tags: [service]

- name: Show results
  ansible.builtin.debug:
    var: taiga_output
  when: docker_debug | default(false)
  tags: [debug]
