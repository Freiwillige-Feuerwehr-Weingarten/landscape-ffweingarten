---
- name: Assert role maturity permits this environment
  ansible.builtin.assert:
    that:
      - jellyfin_status in ['stable', 'testing', 'unstable']
      - >-
        jellyfin_status == 'stable'
        or (jellyfin_status == 'testing' and env | default('') == 'test')
    fail_msg: >-
      Role 'jellyfin' is marked status={{ jellyfin_status }} and cannot run
      against env={{ env | default('unset') }}. Promote the role in
      defaults/main.yml, or override jellyfin_status per host.
  tags: always

- name: Create needed directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - "{{ jellyfin_installation_directory }}"
    - "{{ jellyfin_installation_directory }}/config"
    - "{{ jellyfin_installation_directory }}/cache"
  tags: [setup]

- name: Copy docker compose
  ansible.builtin.template:
    src: templates/docker-compose.yml.j2
    dest: "{{ jellyfin_installation_directory }}/docker-compose.yml"
    mode: "{{ jellyfin_compose_mode }}"
  notify: Restart Jellyfin
  tags: [config]

- name: Create and start services
  community.docker.docker_compose_v2:
    project_src: "{{ jellyfin_installation_directory }}"
    build: policy
    pull: policy
    recreate: auto
  register: jellyfinoutput
  tags: [service]

- name: Show results
  ansible.builtin.debug:
    var: jellyfinoutput
  when: docker_debug
  tags: [debug]
