# Connection settings for the Active Directory / DNS servers
# (lannister + tully). Kept as a separate group (NOT a child of
# `windows`) so the DCs don't get pulled into windows_update.yml or
# windows_install_software.yml — those are for Chocolatey-managed
# workstations, not domain controllers.
#
# Auth mirrors group_vars/windows.yml because the DCs accept the same
# `administrator@feuerwehr` NTLM credentials.
